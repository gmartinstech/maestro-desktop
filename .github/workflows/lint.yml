name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  structlint:
    name: Structure lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned lint/test tools: lint.py invokes watchfiles, vulture, ruff, and pyright.
      - run: pip install -r backend/requirements-dev.txt

      - run: python3 linter/lint.py --root .
