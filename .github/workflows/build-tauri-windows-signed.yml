name: Build Tauri (Windows, signed)

# Builds the Tauri Windows installer(s) and signs them with the SAME Azure Trusted
# Signing setup and secrets `release-windows.yml` (the real, shipping Electron
# release pipeline) already uses, then verifies the signature with the existing
# `scripts/ci/verify-signature.js --require-signed`.
#
# Scope, deliberately narrow (PKG-3):
#   BUILD + SIGN + VERIFY + upload-as-workflow-artifact. That's it.
#   This workflow does NOT publish to the CDN, does NOT create/touch a GitHub
#   Release, and does NOT flip `latest`/any update channel to point at Tauri.
#   Publishing and channel-switching are a deliberate human release decision,
#   owned by CUT-1/CUT-7 later in the migration plan (see
#   docs/plans/txm-status.md) -- not this workflow's job.
#
# Relationship to build-tauri-windows.yml (the existing, UNSIGNED workflow):
#   That workflow stays untouched and keeps validating on every push/PR (no
#   secrets needed, safe for pull_request including forks). This workflow is
#   `workflow_dispatch`-only on purpose: it needs the Azure signing secrets,
#   and secrets must never be reachable from an automatic/PR-triggered run.
#   A human (or a later, deliberately-scoped scheduling ticket) decides when a
#   signed Tauri build is actually needed.
#
# Known pre-existing gap this workflow does NOT attempt to fix (out of scope
# for PKG-3, tracked separately in docs/plans/txm-status.md's "Build-artifact
# readiness" section): `tauri.conf.json`'s `bundle.resources` (added by PKG-1)
# stages `engine/node-runtime/x64/node.exe` and `engine/node_modules.pkg/`,
# neither of which has a committed, CI-reproducible build script yet -- PKG-1
# produced them by hand on a dev machine. Until that staging is scripted, the
# "Build Tauri app" step below can fail for that reason alone; that failure is
# a real, separate gap, not a signing problem, and is called out here rather
# than silently worked around.
#
# Required repository secrets (same names, same values as release-windows.yml):
#   AZURE_TENANT_ID
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_SIGNING_ENDPOINT          e.g. https://wus2.codesigning.azure.net/
#   AZURE_SIGNING_ACCOUNT           mist-code-signing
#   AZURE_SIGNING_CERT_PROFILE      Mist-Windows-Signing
#
# NOT needed here (Electron-only, no equivalent Tauri surface touches them):
#   EVS_ACCOUNT_NAME / EVS_PASSWD                 Widevine VMP signing (castlabs-evs)
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET   bundled MCP server config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign-windows:
    name: Build + sign Tauri NSIS/MSI installers
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      AZURE_TENANT_ID:            ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID:            ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET:        ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT:     ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT:      ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Exact pin, same as release-windows.yml and build-tauri-windows.yml:
          # matches the Node runtime this repo bundles/tests against elsewhere.
          node-version: '20.18.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli

      # Same dlib install as release-windows.yml's "Install Microsoft.Trusted.Signing.Client"
      # step -- signtool needs this to talk to Azure Trusted Signing.
      - name: Install Microsoft.Trusted.Signing.Client (dlib for signtool)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlibDir = Join-Path $env:GITHUB_WORKSPACE 'trusted-signing-client'
          New-Item -ItemType Directory -Force -Path $dlibDir | Out-Null
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -OutputDirectory $dlibDir -ExcludeVersion
          $dlib = Join-Path $dlibDir 'Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) {
            Get-ChildItem -Path $dlibDir -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            throw "Azure.CodeSigning.Dlib.dll not found after NuGet install"
          }
          "AZURE_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AZURE_SIGNING_DLIB=$dlib"

      # Same signtool discovery as release-windows.yml's "Locate signtool.exe on the runner" step.
      - name: Locate signtool.exe on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue `
            | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } `
            | Sort-Object FullName -Descending
          if (-not $candidates) { throw "signtool.exe not found on runner" }
          $signtool = $candidates[0].FullName
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SIGNTOOL_PATH=$signtool"

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: npm run build

      - name: Verify frontend distribution exists
        shell: pwsh
        run: |
          $distPath = 'frontend/dist/index.html'
          if (-not (Test-Path $distPath)) {
            Write-Error "Frontend distribution not found at $distPath"
            exit 1
          }
          Write-Host "Frontend distribution found at frontend/dist"

      - name: Install engine dependencies
        shell: bash
        working-directory: engine
        run: npm ci

      - name: Build engine
        shell: bash
        working-directory: engine
        run: npm run build

      - name: Build Tauri app (release, unsigned NSIS + MSI)
        shell: bash
        working-directory: tauri
        run: |
          set -e
          echo "Building Tauri app (release)..."
          cargo tauri build
          echo "Tauri build completed successfully"

      - name: Locate NSIS + MSI installers
        id: installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem -Path 'tauri/target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem -Path 'tauri/target/release/bundle/msi' -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "No NSIS .exe installer found under tauri/target/release/bundle/nsis" }
          if (-not $msi)  { throw "No MSI installer found under tauri/target/release/bundle/msi" }
          Write-Host "NSIS installer: $($nsis.FullName)"
          Write-Host "MSI installer:  $($msi.FullName)"
          "nsis_path=$($nsis.FullName)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_path=$($msi.FullName)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Signs both installers directly with signtool + the Azure Trusted Signing dlib,
      # the same invocation electron/build/sign-windows.js uses for the Electron pipeline
      # (that file is electron/**-owned/read-only reference for this ticket, so this step
      # mirrors its `signtool sign /fd SHA256 /tr <ts> /td SHA256 /dlib ... /dmdf ...`
      # shape rather than importing it -- Tauri has no electron-builder afterSign hook to
      # plug into, there is no NSIS/MSI equivalent of that hook to reuse here).
      - name: Sign installers (Azure Trusted Signing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $timestampUrl = 'http://timestamp.acs.microsoft.com'
          $metadata = @{
            Endpoint = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_CERT_PROFILE
            ExcludeEnvironmentCredential = 'false'
          }
          $metadataPath = Join-Path $env:RUNNER_TEMP 'ts-metadata.json'
          ($metadata | ConvertTo-Json) | Out-File -FilePath $metadataPath -Encoding utf8

          $targets = @(
            '${{ steps.installers.outputs.nsis_path }}',
            '${{ steps.installers.outputs.msi_path }}'
          )
          foreach ($target in $targets) {
            Write-Host "Signing $target"
            & $env:SIGNTOOL_PATH sign /v /fd SHA256 /tr $timestampUrl /td SHA256 /dlib $env:AZURE_SIGNING_DLIB /dmdf $metadataPath $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $target (exit $LASTEXITCODE)" }
          }
          Remove-Item -Force $metadataPath -ErrorAction SilentlyContinue

      # Same gate release-windows.yml runs post-sign: verify-signature.js --require-signed
      # exits non-zero unless Get-AuthenticodeSignature/signtool report Status == Valid.
      - name: Verify installers are validly signed
        shell: pwsh
        run: |
          node scripts/ci/verify-signature.js --require-signed --target '${{ steps.installers.outputs.nsis_path }}'
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer is not validly signed" }
          node scripts/ci/verify-signature.js --require-signed --target '${{ steps.installers.outputs.msi_path }}'
          if ($LASTEXITCODE -ne 0) { throw "MSI installer is not validly signed" }

      # Artifact only -- no CDN publish, no GitHub Release, no channel switch. See header.
      - name: Upload signed installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-tauri-windows-x64-signed
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
